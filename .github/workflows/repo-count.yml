name: Update Profile Repository Count

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Update project count in README
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Shivainfinity12';
            const repo = 'Shivainfinity12';

            const repos = await github.paginate(
              github.rest.repos.listForUser,
              { username: owner, per_page: 100, type: 'owner' }
            );

            const publicRepoCount = repos.filter(r => !r.private).length;

            const file = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'README.md',
              ref: 'main'
            });

            const content = Buffer.from(file.data.content, 'base64').toString('utf8');
            const updated = content.replace(
              /github\.com\/badge\/Projects-\d+-0ea5e9/g,
              `github.com/badge/Projects-${publicRepoCount}-0ea5e9`
            );

            if (updated === content) {
              core.info(`Projects badge already shows ${publicRepoCount}.`);
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'README.md',
              message: `chore: update project count to ${publicRepoCount}`,
              content: Buffer.from(updated).toString('base64'),
              sha: file.data.sha,
              branch: 'main'
            });

            core.info(`Updated project count to ${publicRepoCount}.`);
